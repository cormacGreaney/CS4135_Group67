spring.application.name=payment-service

# Run payment-service on its own port in local development.
server.port=8084

# We use JWT-based auth later, not Spring's default generated login user.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# PostgreSQL connection for the payment service database.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/payment_service}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

# Flyway owns the schema. Hibernate only checks that the entity matches the table.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.locations=classpath:db/migration

# Optional demo payment after Flyway (classpath:db/seed/demo_payments.sql). Set false to skip (e.g. tests).
app.payments.seed.enabled=${PAYMENTS_SEED_ENABLED:true}

# Using the same shared JWT secret as the other services.
app.jwt.secret=${JWT_SECRET:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# RabbitMQ (order/payment async integration). In Docker, SPRING_RABBITMQ_* is set by compose.
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:app}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:app}

# Internal callback to order-service (Docker hostname). Same token as order-service app.internal-api.token.
app.order-service.base-url=${ORDER_SERVICE_BASE_URL:http://localhost:8085}
app.internal-api.token=${INTERNAL_API_TOKEN:dev-internal-token}

# Keep orders in PENDING until explicit card checkout is called.
app.payment.auto-from-order-created=${AUTO_PAY_FROM_ORDER_CREATED:false}
