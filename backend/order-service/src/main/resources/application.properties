spring.application.name=order-Service
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/order_service?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&serverTimezone=UTC&useSSL=false}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:mysql}
# Flyway applies schema on startup (works even when Docker MySQL init.sql already ran once).
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
server.port=${SERVER_PORT:8085}

# Show exception message in JSON error responses (helps debug 500s during development).
server.error.include-message=always

# RabbitMQ (order/payment async integration). In Docker, SPRING_RABBITMQ_* is set by compose.
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:app}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:app}

# Shared with payment-service for /internal/orders/.../payment-result backup calls.
app.internal-api.token=${INTERNAL_API_TOKEN:dev-internal-token}
app.product-service.base-url=${PRODUCT_SERVICE_BASE_URL:http://localhost:8082}
app.jwt.secret=${JWT_SECRET:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
