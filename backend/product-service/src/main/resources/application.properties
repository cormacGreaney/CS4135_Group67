spring.application.name=product-service

# This service listens here. Docker maps product DB to localhost:3307 on your machine.
server.port=8082

# We use JWT only — not Spring's default login form user.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# MySQL database name product_service. If the DB is missing, the driver can create it on first connect.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/product_service?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&serverTimezone=UTC&useSSL=false}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:mysql}

# Tables come from Flyway scripts — Hibernate only checks they match the Java classes.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.locations=classpath:db/migration

# Extra alcohol products from classpath:db/seed/alcohol_products.sql after Flyway. Set false to skip.
app.catalog.seed-alcohol.enabled=true

# Same secret as user-service — otherwise login tokens from the auth API won't work here.
app.internal-api.token=${INTERNAL_API_TOKEN:dev-internal-token}
app.jwt.secret=${JWT_SECRET:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
