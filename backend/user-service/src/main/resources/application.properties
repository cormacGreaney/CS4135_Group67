spring.application.name=user-service

# Run on 8081 so api-gateway can own 8080 in local dev.
server.port=8081

# No auto-generated Spring Security user (we use JWT only).
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# PostgreSQL — create database `user_service` locally, or point URL at instance.
# Override with SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/user_service}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

# Schema is owned by Flyway (see db/migration). JPA only validates mapping.
# If an old dev DB was created only by Hibernate, drop/recreate the schema or align manually before Flyway runs.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.locations=classpath:db/migration

# JWT (override JWT_SECRET in production; dev default is 64 hex chars for HS256)
app.jwt.secret=${JWT_SECRET:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
