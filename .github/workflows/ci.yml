name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    name: Build all stack images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate compose file
        run: docker compose config --quiet

      - name: Validate production compose file
        run: docker compose -f docker-compose.prod.yml --env-file compose.prod.env.example config --quiet

      - name: Build all application images
        run: docker compose build
        env:
          DOCKER_BUILDKIT: 1
