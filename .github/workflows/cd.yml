name: CD

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    name: Publish images to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Oracle Ampere / ARM64 VMs need arm64 images; GitHub runners are amd64 — build both.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize owner to lowercase
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - name: Compute tags
        id: vars
        run: echo "SHORT=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Build & push user-service
        uses: docker/build-push-action@v6
        with:
          context: ./backend/user-service
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/ecommerce-user-service:sha-${{ steps.vars.outputs.SHORT }}
            ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/ecommerce-user-service:latest

      - name: Build & push order-service
        uses: docker/build-push-action@v6
        with:
          context: ./backend/order-service
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/ecommerce-order-service:sha-${{ steps.vars.outputs.SHORT }}
            ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/ecommerce-order-service:latest

      - name: Build & push product-service
        uses: docker/build-push-action@v6
        with:
          context: ./backend/product-service
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/ecommerce-product-service:sha-${{ steps.vars.outputs.SHORT }}
            ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/ecommerce-product-service:latest

      - name: Build & push payment-service
        uses: docker/build-push-action@v6
        with:
          context: ./backend/payment-service
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/ecommerce-payment-service:sha-${{ steps.vars.outputs.SHORT }}
            ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/ecommerce-payment-service:latest

      - name: Build & push api-gateway
        uses: docker/build-push-action@v6
        with:
          context: ./backend/api-gateway
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/ecommerce-api-gateway:sha-${{ steps.vars.outputs.SHORT }}
            ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/ecommerce-api-gateway:latest

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          target: production
          platforms: linux/amd64,linux/arm64
          build-args: |
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL || 'http://localhost:8080' }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/ecommerce-frontend:sha-${{ steps.vars.outputs.SHORT }}
            ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/ecommerce-frontend:latest
