# the full local stack right nowis Postgres, user-service, api-gateway, Vite frontend.
# From repo root: npm run dev, or: docker compose up --build

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: user_service
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 5s
      retries: 15

  user-service:
    build:
      context: ./backend/user-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/user_service
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8081"

  order-service:
    image: mysql:8.3.0
    environment:
      MYSQL_ROOT_PASSWORD: mysql
      MYSQL_DATABASE: order_service
    ports:
      - "3306:3306"
    volumes:
      - order-mysql-data:/var/lib/mysql
      - ./backend/order-service/docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql

  api-gateway:
    build:
      context: ./backend/api-gateway
    environment:
      USER_SERVICE_URL: http://user-service:8081
    ports:
      - "8080:8080"
    depends_on:
      - user-service

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8080
    ports:
      - "5173:5173"
    depends_on:
      - api-gateway

volumes:
  order-mysql-data: